name: Backend Checks
jobs:
  test:
    name: Compose Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'CICD_FOR_FORKED_REPO' || null }}
    env:
      SERVER_OPENAI_API_KEY: ${{ secrets.SERVER_OPENAI_API_KEY }}
      CLI_OPENAI_API_KEY: ${{ secrets.CLI_OPENAI_API_KEY }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: post-checkout probe"
        echo "GERALT_DBG: pwd=$(pwd)"
        head_sha="$(git rev-parse HEAD 2>/dev/null || true)"
        printf 'GERALT_DBG: HEAD=%s\n' "${head_sha:-unavailable}"
        for f in backend/compose.yml backend/compose.ci.yml; do
          if test -f "$f"; then
            printf 'GERALT_DBG: %s present\n' "$f"
          else
            printf 'GERALT_DBG: %s MISSING\n' "$f"
          fi
        done
      continue-on-error: true
    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v1
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink probe"
        server_key="${SERVER_OPENAI_API_KEY:-}"
        cli_key="${CLI_OPENAI_API_KEY:-}"
        printf 'GERALT_DBG: SERVER_OPENAI_API_KEY set=%s len=%s\n' "$(test -n "$server_key" && echo yes || echo no)" "${#server_key}"
        printf 'GERALT_DBG: CLI_OPENAI_API_KEY set=%s len=%s\n' "$(test -n "$cli_key" && echo yes || echo no)" "${#cli_key}"
        for f in backend/compose.yml backend/compose.ci.yml; do
          if test -f "$f"; then
            printf 'GERALT_DBG: %s present\n' "$f"
          else
            printf 'GERALT_DBG: %s MISSING\n' "$f"
          fi
        done
      continue-on-error: true
    - name: Run compose test
      id: run_tests
      working-directory: backend
      run: |
        docker compose -f compose.yml -f compose.ci.yml run test-runner
    - name: Get service names
      id: service_names
      if: always()
      run: |-
        echo "names<<EOF" >> "$GITHUB_OUTPUT"
        echo "test-runner" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
  schedule:
  - cron: 0 9 * * *
