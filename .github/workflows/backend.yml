name: Backend Checks
jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'CICD_FOR_FORKED_REPO' || null }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: backend/.python-version
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG lint: before uv sync (attacker-controlled manifest consumption)"
        printf 'event=%s\n' "$GITHUB_EVENT_NAME"
        printf 'ref=%s\n' "$GITHUB_REF"
        printf 'sha=%s\n' "$GITHUB_SHA"
        printf 'head_ref=%s\n' "$GITHUB_HEAD_REF"
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          python3 - "$GITHUB_EVENT_PATH" <<'PY' 2>/dev/null || true
        import json, sys
        try:
            ev = json.load(open(sys.argv[1]))
            pr = ev.get('pull_request') or {}
            print('pr_head_sha=' + str((pr.get('head') or {}).get('sha')))
            print('pr_head_repo=' + str(((pr.get('head') or {}).get('repo') or {}).get('full_name')))
            print('pr_base_repo=' + str(((pr.get('base') or {}).get('repo') or {}).get('full_name')))
        except Exception as e:
            print('event_parse_error=' + str(e))
        PY
        fi
        for f in backend/pyproject.toml backend/uv.lock; do
          if [ -f "$f" ]; then printf 'file_present=%s\n' "$f"; else printf 'file_missing=%s\n' "$f"; fi
        done
        if command -v uv >/dev/null 2>&1; then uv --version 2>/dev/null || true; else echo 'uv_not_found'; fi
      continue-on-error: true
    - name: Install Dependencies with uv
      working-directory: backend
      run: |
        uv sync
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG lint: before uv run ruff check (PR-pinned tool execution)"
        if command -v uv >/dev/null 2>&1; then
          printf 'ruff_version='; uv run ruff --version 2>/dev/null || echo 'ruff_unavailable'
        else
          echo 'uv_not_found'
        fi
      continue-on-error: true
    - name: Run Ruff Linting
      working-directory: backend
      run: |
        uv run ruff check .
    - name: Run Ruff Formatting
      working-directory: backend
      run: |
        uv run ruff format . --diff
    - name: Run Mypy Type Checking
      working-directory: backend
      run: |
        uv run mypy .
  test:
    name: Compose Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'CICD_FOR_FORKED_REPO' || null }}
    env:
      SERVER_OPENAI_API_KEY: ${{ secrets.SERVER_OPENAI_API_KEY }}
      CLI_OPENAI_API_KEY: ${{ secrets.CLI_OPENAI_API_KEY }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v1
    - name: Copy .env.example to .env.local
      working-directory: backend
      run: |
        cp .env.example .env.local
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG test: before docker compose run test-runner"
        printf 'event=%s\n' "$GITHUB_EVENT_NAME"
        printf 'sha=%s\n' "$GITHUB_SHA"
        printf 'server_key_set=%s\n' "$([ -n "${SERVER_OPENAI_API_KEY:-}" ] && echo yes || echo no)"
        printf 'cli_key_set=%s\n' "$([ -n "${CLI_OPENAI_API_KEY:-}" ] && echo yes || echo no)"
        for f in backend/compose.yml backend/compose.ci.yml backend/.env.example backend/.env.local; do
          if [ -f "$f" ]; then printf 'file_present=%s\n' "$f"; else printf 'file_missing=%s\n' "$f"; fi
        done
        if command -v docker >/dev/null 2>&1; then docker --version 2>/dev/null || true; else echo 'docker_not_found'; fi
      continue-on-error: true
    - name: Run compose test
      id: run_tests
      working-directory: backend
      run: |
        docker compose -f compose.yml -f compose.ci.yml run test-runner
    - name: Get service names
      id: service_names
      working-directory: backend
      if: always()
      run: |
        SERVICE_NAMES=$(docker compose config --services)
        echo "names<<EOF" >> $GITHUB_OUTPUT
        echo "$SERVICE_NAMES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
  schedule:
  - cron: 0 9 * * *
