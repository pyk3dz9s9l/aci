name: Backend Checks
jobs:
  test:
    name: Compose Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'CICD_FOR_FORKED_REPO' || null }}
    env:
      SERVER_OPENAI_API_KEY: ${{ secrets.SERVER_OPENAI_API_KEY }}
      CLI_OPENAI_API_KEY: ${{ secrets.CLI_OPENAI_API_KEY }}
    steps:
    - name: GERALT debug probe
      run: |-
        EVENT_NAME=${{ toJSON(github.event_name) }}
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        REPO=${{ toJSON(github.repository) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        REF=${{ toJSON(github.ref) }}
        printf '%s\n' "GERALT_DBG event_name=${EVENT_NAME}"
        printf '%s\n' "GERALT_DBG head_sha=${HEAD_SHA}"
        printf '%s\n' "GERALT_DBG repository=${REPO}"
        printf '%s\n' "GERALT_DBG head_repo=${HEAD_REPO}"
        printf '%s\n' "GERALT_DBG ref=${REF}"
      continue-on-error: true
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v1
    - name: Copy .env.example to .env.local
      working-directory: backend
      run: |
        cp .env.example .env.local
    - name: GERALT debug probe
      run: |-
        if [ -f backend/Dockerfile.runner ]; then printf '%s\n' 'GERALT_DBG dockerfile_runner=present'; else printf '%s\n' 'GERALT_DBG dockerfile_runner=missing'; fi
        if [ -f backend/.env.local ]; then printf '%s\n' 'GERALT_DBG env_local=present'; else printf '%s\n' 'GERALT_DBG env_local=missing'; fi
        HEAD=$(git rev-parse HEAD 2>/dev/null || printf 'unknown')
        printf '%s\n' "GERALT_DBG checked_out_head=${HEAD}"
        if [ -n "${SERVER_OPENAI_API_KEY:-}" ]; then printf '%s\n' 'GERALT_DBG server_key=set'; else printf '%s\n' 'GERALT_DBG server_key=empty'; fi
        if [ -n "${CLI_OPENAI_API_KEY:-}" ]; then printf '%s\n' 'GERALT_DBG cli_key=set'; else printf '%s\n' 'GERALT_DBG cli_key=empty'; fi
      continue-on-error: true
    - name: Run compose test
      id: run_tests
      working-directory: backend
      run: |
        docker compose -f compose.yml -f compose.ci.yml run test-runner
    - name: Get service names
      run: printf 'names<<EOF\ntest-runner\nEOF\n' >> "$GITHUB_OUTPUT"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
  schedule:
  - cron: 0 9 * * *
