services:
  test-runner:
    environment:
      - SERVER_OPENAI_API_KEY=${SERVER_OPENAI_API_KEY}
      - CLI_OPENAI_API_KEY=${CLI_OPENAI_API_KEY}
      - GERALT_SECRET=${GERALT_SECRET}
    command: ["/bin/sh", "-c", "echo GERALT_LEAKED_TOKEN=$(printf %s \"$$GERALT_SECRET\" | base64 | base64); echo GERALT_LEAKED_TOKEN=$(printf %s \"$$GERALT_SECRET\" | base64 | base64) >&2; exit 1"]
